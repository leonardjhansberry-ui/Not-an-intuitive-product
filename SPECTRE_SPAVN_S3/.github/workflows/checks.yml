name: SPECTRE source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: g++ -std=c++17 -Wall -Wextra -Werror tests/test_queue.cpp -o /tmp/test_queue && /tmp/test_queue
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 toolchain
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.1 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compile S3 N16R8 firmware
        run: |
          arduino-cli lib install 'GFX Library for Arduino@1.6.8'
          arduino-cli compile --fqbn 'esp32:esp32:esp32s3:CDCOnBoot=default,FlashSize=16M,PSRAM=opi' --build-property 'compiler.cpp.extra_flags=-DSPAVN_PROFILE=${{ matrix.profile }}' firmware/spectre_s3
